services:
  caspian-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caspian-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/caspian.db
      - LOG_LEVEL=INFO
    volumes:
      # Persistent SQLite database storage
      - ./data:/app/data
      # Exported monochrome research documents (PDF / DOCX)
      - ./documents:/app/documents
      # Application audit and execution logs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "/app/scripts/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
